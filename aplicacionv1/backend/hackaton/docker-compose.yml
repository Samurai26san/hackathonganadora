services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: presupuesto
      POSTGRES_USER: presupuesto
      POSTGRES_PASSWORD: presupuesto
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presupuesto"]
      interval: 3s
      retries: 20

  app:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://presupuesto:presupuesto@db:5432/presupuesto
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-esta-clave-de-32-bytes-min}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  # Copia de seguridad diaria de la base de datos en ./backups
  backup:
    image: postgres:16
    environment: { PGPASSWORD: presupuesto }
    volumes: ["./backups:/backups"]
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U presupuesto presupuesto > /backups/presupuesto_$$(date +%F).sql; sleep 86400; done"]

volumes:
  pgdata:
