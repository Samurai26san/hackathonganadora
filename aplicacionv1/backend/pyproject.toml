[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["hackaton", ".venv"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "rank_bm25.*", "docx.*", "tiktoken.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["hackaton", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py311"]
extend-exclude = "hackaton|.venv"
